[package]
name = "typeid"
version = "0.4.0"
edition = "2024"
resolver = "3"

[lib]
crate-type = ["cdylib", "lib"]


[features]
default = ["pg18"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []

[dependencies]
gxhash = { version = "3.5.0" }
pgrx = "=0.19.2"
serde = "1.0.229"
thiserror = "2.0.20"
uuid = { version = "1.24", features = ["v7", "fast-rng", "serde"] }

[dev-dependencies]
pgrx-tests = "=0.19.2"
serde_yaml_ng = "0.10"
libtest-mimic = "0.8"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[[test]]
name = "spec"
path = "tests/spec.rs"
harness = false
