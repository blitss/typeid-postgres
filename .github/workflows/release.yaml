name: Build • Publish • Release

# We still build + release when a tag like v1.2.3 is pushed
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  EXTENSION_NAME: typeid
  DOCKER_IMAGE: ghcr.io/blitss/typeid-pg

jobs:
  # -------------------------------------------------------------
  # 1. Build binaries for every PG version / OS / arch
  # -------------------------------------------------------------
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        pg_version: [14, 15, 16, 17, 18]
        os:
          [
            # Built on the OLDEST runtime we support, not the newest. glibc is
            # backward but not forward compatible: a binary linked on 24.04
            # (glibc 2.39) will not load on Debian bookworm (2.36), which is
            # what cloudnative-pg and most Postgres images are based on.
            # 22.04 gives glibc 2.35, which loads everywhere newer.
            ubuntu-22.04,
            ubuntu-22.04-arm,
            macos-latest,
          ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # --- Rust toolchain ----------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # --- PostgreSQL (Linux) ------------------------------------------
      - name: Install PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y wget gnupg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          sudo apt-get update -y -qq --fix-missing
          sudo apt-get install -y postgresql-${{ matrix.pg_version }} \
                                  postgresql-server-dev-${{ matrix.pg_version }}
          sudo chmod a+rwx \
            `/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config --pkglibdir` \
            `/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config --sharedir`/extension \
            /var/run/postgresql/

      # --- PostgreSQL (macOS) ------------------------------------------
      - name: Install PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@${{ matrix.pg_version }}
          echo "/usr/local/opt/postgresql@${{ matrix.pg_version }}/bin" >> $GITHUB_PATH

      # --- cargo-pgrx ---------------------------------------------------
      - name: Install cargo-pgrx
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            PG_CONFIG_PATH="/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config"
          else
            PG_CONFIG_PATH="/opt/homebrew/opt/postgresql@${{ matrix.pg_version }}/bin/pg_config"
          fi
          PGRX_VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="pgrx") | .version')
          cargo install --locked --version "$PGRX_VERSION" cargo-pgrx --debug --force
          cargo pgrx init --pg${{ matrix.pg_version }} "$PG_CONFIG_PATH"

      # --- Build --------------------------------------------------------
      - name: Build
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            PG_CONFIG_PATH="/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config"
          else
            PG_CONFIG_PATH="/opt/homebrew/opt/postgresql@${{ matrix.pg_version }}/bin/pg_config"
          fi
          cargo pgrx package --features pg${{ matrix.pg_version }} \
                             --pg-config "$PG_CONFIG_PATH"

      # --- Guard against shipping a binary the targets cannot load ------
      #
      # Compiling and linking succeed on the build host regardless; the failure
      # only appears at dlopen time on an older runtime, which no test here
      # would reach. So assert the requirement directly.
      #
      # 2.35 is what Ubuntu 22.04 provides. Debian bookworm, the base for
      # cloudnative-pg and the official postgres images, has 2.36.
      - name: Check glibc requirements (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          MAX_ALLOWED="2.35"
          SO="target/release/${{ env.EXTENSION_NAME }}-pg${{ matrix.pg_version }}$(/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config --pkglibdir)/${{ env.EXTENSION_NAME }}.so"
          echo "Inspecting ${SO}"

          REQUIRED="$(objdump -T "${SO}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -u -V || true)"
          echo "Requires: $(echo "${REQUIRED}" | tr '\n' ' ')"

          HIGHEST="$(echo "${REQUIRED}" | sed 's/GLIBC_//' | sort -V | tail -1)"
          if [ "$(printf '%s\n%s\n' "${MAX_ALLOWED}" "${HIGHEST}" | sort -V | tail -1)" != "${MAX_ALLOWED}" ]; then
            echo "::error::Binary needs glibc ${HIGHEST}, above the ${MAX_ALLOWED} ceiling."
            echo "It will fail to load on Debian bookworm (2.36) with 'version GLIBC_... not found'."
            echo "Offending symbols:"
            objdump -T "${SO}" | grep -E "GLIBC_(2\.3[6-9]|2\.[4-9][0-9])" || true
            exit 1
          fi
          echo "OK: highest requirement is ${HIGHEST}"

      # --- Normalise OS + arch names -----------------------------------
      - name: Format OS name for release
        run: echo "LOWERCASE_OS=$(uname -s | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Format arch
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)            ARCH="amd64" ;;
            aarch64|arm64)     ARCH="arm64" ;;
          esac
          echo "ARCH=$ARCH" >> $GITHUB_ENV

      # --- Tarball artifact --------------------------------------------
      - name: Package Extension
        run: |
          mkdir -p release
          tar -czvf \
            release/${{ env.EXTENSION_NAME }}-pg${{ matrix.pg_version }}-${{ env.LOWERCASE_OS }}-${{ env.ARCH }}.tar.gz \
            -C target/release/${{ env.EXTENSION_NAME }}-pg${{ matrix.pg_version }} .

      # --- Upload artifact for later -----------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-pg${{ matrix.pg_version }}-${{ env.LOWERCASE_OS }}-${{ env.ARCH }}
          path: release/*.tar.gz
          retention-days: 29

  # -------------------------------------------------------------
  # 2. Build & push the multi-arch Docker image
  # -------------------------------------------------------------
  build-and-push-docker:
    needs: build-and-publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v7

      # It's just copying built files, so QEMU is fine
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.pg_version }}
            type=raw,value=latest,enable=${{ matrix.pg_version == 18 }}
            type=raw,value=${{ github.ref_name }},enable=${{ matrix.pg_version == 18 }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # 3. Draft / publish the GitHub Release
  # -------------------------------------------------------------
  release:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create / update the release
      packages: write # attach artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          # We need full history to check ancestry against main
          fetch-depth: 0

      # --- 3-a. Pull all artifacts built in the matrix -----------------
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-assets-*
          merge-multiple: true

      # --- 3-b. Draft release notes from Conventional Commits ----------
      - name: Release Drafter (Conventional Commits)
        id: notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.ref_name }} # the tag we just pushed
          publish: false # keep as draft for now
          prerelease: false # we'll flip below
          config-name: release-drafter.yml

      # --- 3-c. Flip logic: ONLY "main" ⇒ final ------------------------
      - name: Is this tag reachable from main?
        id: prerelease
        run: |
          git fetch origin main --quiet || true
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "is_pre=false" >> "$GITHUB_OUTPUT"   # on main  → latest
          else
            echo "is_pre=true"  >> "$GITHUB_OUTPUT"   # not main → prerelease
          fi

      # --- 3-d. Publish / update Release & attach artifacts ------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          tag_name: ${{ steps.notes.outputs.tag_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_pre }}
          draft: false
          files: |
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
