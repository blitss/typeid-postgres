name: Test migration SQL scripts

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "false"

jobs:
  Migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          sudo apt-get update -y -qq --fix-missing
          sudo apt-get install postgresql-16 postgresql-server-dev-16

      - name: Install previous latest version
        run: |
          # Install.sh will by default install the latest stable release that we'll need to test against.
          sudo bash install.sh

      - name: Start PostgreSQL and create test database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s -d -r -w runner
          createdb -U runner test_extension

      - name: Create test data
        run: |
          psql -U runner -d test_extension -c "CREATE EXTENSION typeid;"
          psql -U runner -d test_extension -c "
            CREATE TABLE migration_test (id typeid, name text);
            INSERT INTO migration_test VALUES 
              (typeid_generate('user'), 'Alice'),
              (typeid_generate('admin'), 'Bob'),
              (typeid_generate(''), 'Anonymous');"
          # Verify v0.1.0 works
          psql -U runner -d test_extension -c "SELECT COUNT(*) FROM migration_test;"
          psql -U runner -d test_extension -c "SELECT typeid_generate('user') FROM migration_test;"

      - name: Install cargo-pgrx
        run: |
          PGRX_VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[]|select(.name=="pgrx")|.version')
          cargo install --locked --version=$PGRX_VERSION cargo-pgrx --debug --force
          cargo pgrx init --pg16 $(which pg_config)

      - name: Install latest version and test migration
        run: |
          # Build the new version and install
          cargo pgrx package --features pg16 --pg-config $(which pg_config)
          cargo pgrx install --features pg16 --release --sudo

          # Perform the migration
          psql -U runner -d test_extension -c "ALTER EXTENSION typeid UPDATE;"
          psql -U runner -d test_extension -c "SELECT extversion FROM pg_extension WHERE extname = 'typeid';"

          # Verify old data still works
          psql -U runner -d test_extension -c "SELECT COUNT(*) FROM migration_test;"
          psql -U runner -d test_extension -c "SELECT typeid_prefix(id) FROM migration_test;"

          # Test new functions
          # todo: should extract that to a test sql file
          psql -U runner -d test_extension -c "SELECT typeid_generate_nil();"
          psql -U runner -d test_extension -c "SELECT typeid_is_valid('user_01h455vb4pex5vsknk084sn02q');"
          psql -U runner -d test_extension -c "SELECT COUNT(*) FROM migration_test WHERE id @> 'user';"
          psql -U runner -d test_extension -c "SELECT typeid_has_prefix(typeid_generate('test'), 'test');"
      # The Rust test suite only ever sees a freshly created extension. Operator
      # metadata is the one thing an upgrade script has to patch in place, so it
      # is only ever exercised here.
      - name: Verify operator metadata survived the upgrade
        run: |
          # @< used to be a shell operator: named as the commutator of @> and
          # never defined. Using it failed with "operator is only a shell".
          psql -U runner -d test_extension -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM migration_test WHERE 'user' @< id;"

          # Without RESTRICT/JOIN the planner assumes every predicate matches
          # ~50% of the table and stops choosing indexes on typeid columns.
          psql -U runner -d test_extension -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF EXISTS (
                SELECT 1 FROM pg_operator
                WHERE oprleft = 'typeid'::regtype
                  AND oprright = 'typeid'::regtype
                  AND (oprrest = 0 OR oprjoin = 0)
              ) THEN
                RAISE EXCEPTION 'comparison operators lack selectivity estimators after upgrade';
              END IF;

              IF EXISTS (
                SELECT 1 FROM pg_operator
                WHERE oprname IN ('@>', '@<')
                  AND (oprleft = 'typeid'::regtype OR oprright = 'typeid'::regtype)
                  AND (oprrest = 0 OR oprjoin = 0 OR oprcode = 0)
              ) THEN
                RAISE EXCEPTION 'prefix operators are shells or lack estimators after upgrade';
              END IF;
            END \$\$;"

          # And the planner-visible consequence: equality on a unique column
          # must not be estimated as half the table.
          psql -U runner -d test_extension -v ON_ERROR_STOP=1 -c "
            CREATE TABLE sel_check (id typeid PRIMARY KEY);
            INSERT INTO sel_check SELECT typeid_generate('row') FROM generate_series(1, 2000);
            ANALYZE sel_check;
            DO \$\$
            DECLARE
              plan json;
              est  float8;
            BEGIN
              EXECUTE 'EXPLAIN (FORMAT JSON) SELECT id FROM sel_check WHERE id = typeid_generate(''row'')'
                INTO plan;
              est := (plan -> 0 -> 'Plan' ->> 'Plan Rows')::float8;
              IF est > 5 THEN
                RAISE EXCEPTION 'equality on a unique column estimated % rows, expected ~1', est;
              END IF;
            END \$\$;"
